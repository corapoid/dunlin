[workspace]
resolver = "3"
members = ["apps/desktop", "crates/*"]
exclude = ["vendor/*"]

[patch.crates-io]
block = { path = "vendor/block-0.1.6" }
gpui-base = { path = "vendor/gpui-base-0.8.0" }
gpui-component = { path = "vendor/gpui-component-0.8.0" }
gpui-pre = { path = "vendor/gpui-pre-0.3.9" }
syntect = { path = "vendor/syntect-5.3.0" }
two-face = { path = "vendor/two-face-0.4.5" }
metal = { path = "vendor/metal-0.33.0" }
pulp = { path = "vendor/pulp-0.22.3" }
rav1e = { path = "vendor/rav1e-0.8.1" }
cosmic-text = { path = "vendor/cosmic-text-0.19.0" }

[workspace.package]
version = "0.1.0-beta.10"
edition = "2024"
rust-version = "1.92"
license = "MIT"
authors = ["Dunlin contributors"]
repository = "https://github.com/corapoid/dunlin"
homepage = "https://github.com/corapoid/dunlin"

[workspace.dependencies]
gpui-kit = { version = "0.9.0", features = ["syntect"] }
dunlin-ui = { path = "crates/ui" }
dunlin-domain = { path = "crates/domain" }
dunlin-agent = { path = "crates/agent" }
dunlin-artifacts = { path = "crates/artifacts" }
dunlin-audit = { path = "crates/audit" }
dunlin-plugin = { path = "crates/plugin" }
dunlin-storage = { path = "crates/storage" }
dunlin-vault = { path = "crates/vault" }
dunlin-workspace = { path = "crates/workspace" }
dunlin-usage = { path = "crates/usage" }
dunlin-terminal = { path = "crates/terminal" }
notify = "8.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSDockTile", "NSView", "NSVisualEffectView"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSFileManager", "NSURL", "NSError"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }

# GPUI is slow in debug builds. Keep our own code debuggable while making the
# framework fast enough to use during development. Debug info is limited to our
# own crates so the artifact footprint stays reasonable on small disks.
[profile.dev]
debug = 0
incremental = false

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
harfrust = { opt-level = 3 }
taffy = { opt-level = 3 }
skrifa = { opt-level = 3 }
dunlin = { debug = 2 }
dunlin-ui = { debug = 2 }
dunlin-domain = { debug = 2 }
dunlin-agent = { debug = 2 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
