[workspace]
resolver = "3"
members = ["apps/desktop", "crates/*"]
exclude = ["vendor/*", "plugins/*"]

[patch.crates-io]
block = { path = "vendor/block-0.1.6" }
gpui-kit = { path = "vendor/gpui-kit-0.9.0" }
gpui-kit-assets = { path = "vendor/gpui-kit-assets-0.9.0" }
gpui-base = { path = "vendor/gpui-base-0.9.0" }
gpui-component = { path = "vendor/gpui-component-0.9.0" }
gpui-pre = { path = "vendor/gpui-pre-0.3.12" }
syntect = { path = "vendor/syntect-5.3.0" }
two-face = { path = "vendor/two-face-0.5.2+bat-0.26.1" }
rav1e = { path = "vendor/rav1e-0.8.1" }
cosmic-text = { path = "vendor/cosmic-text-0.19.0" }

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
authors = ["Dunlin contributors"]
repository = "https://github.com/corapoid/dunlin"
homepage = "https://github.com/corapoid/dunlin"

[workspace.dependencies]
hex = "0.4.3"
gpui-kit = { version = "0.9.0", features = ["syntect"] }
dunlin-ui = { path = "crates/ui" }
dunlin-http = { path = "crates/http" }
dunlin-domain = { path = "crates/domain" }
dunlin-agent = { path = "crates/agent" }
dunlin-coordination = { path = "crates/coordination" }
dunlin-artifacts = { path = "crates/artifacts" }
dunlin-audit = { path = "crates/audit" }
dunlin-knowledge = { path = "crates/knowledge" }
dunlin-plugin = { path = "crates/plugin" }
dunlin-plugin-host = { path = "crates/plugin-host" }
dunlin-ssh = { path = "crates/ssh" }
dunlin-storage = { path = "crates/storage" }
dunlin-vault = { path = "crates/vault" }
dunlin-workspace = { path = "crates/workspace" }
dunlin-usage = { path = "crates/usage" }
dunlin-terminal = { path = "crates/terminal" }
notify = "8.2.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSDockTile", "NSView", "NSVisualEffectView"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSFileManager", "NSURL", "NSError"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1.29.2", features = ["v7", "serde"] }

# GPUI is slow in debug builds. Keep our own code debuggable while making the
# framework fast enough to use during development. Debug info is limited to our
# own crates so the artifact footprint stays reasonable on small disks.
[profile.dev]
debug = 0
incremental = false
# `debug = 0` makes Cargo strip debug info with the toolchain's rust-objcopy.
# Some macOS rustup layouts ship an objcopy that cannot load libLLVM, which
# prints a warning for every crate. There is nothing to strip beyond the
# debug=0 default here, so keep the linker output untouched and warnings clean.
strip = false

[profile.dev.build-override]
debug = 0
strip = false

[profile.dev.package]
gpui-pre = { opt-level = 3, strip = false }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
harfrust = { opt-level = 3 }
taffy = { opt-level = 3 }
skrifa = { opt-level = 3 }
dunlin = { debug = 2 }
dunlin-ui = { debug = 2 }
dunlin-domain = { debug = 2 }
dunlin-agent = { debug = 2 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
