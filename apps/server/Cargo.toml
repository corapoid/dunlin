[package]
publish = false
name = "dunlin-relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "dunlin-relay"
path = "src/main.rs"

[dependencies]
ahp-types = "=1.0.0"
hex.workspace = true
dunlin-identity.workspace = true
dunlin-session-runtime.workspace = true
dunlin-workspace.workspace = true
dunlin-usage.workspace = true
dunlin-domain.workspace = true
dunlin-relay-protocol.workspace = true
dunlin-mcp-client.workspace = true
dunlin-terminal.workspace = true
dunlin-storage.workspace = true
dunlin-vault.workspace = true
dunlin-coordination.workspace = true
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "time", "sync", "signal", "fs"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
rand = "0.10.3"
sha2 = "0.11.1"
base64 = "0.23.1"
futures-util = "0.3"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
toml = "1.2.1"
libc = "0.2"
zeroize = "1"
url = "2"
tempfile = "3"

[dev-dependencies]
ahp = "=1.0.0"
openidconnect = { version = "=4.1.0", default-features = false }
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.30.0"
