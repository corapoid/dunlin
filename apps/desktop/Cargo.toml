[package]
name = "dunlin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "dunlin"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
dunlin-ui.workspace = true
dunlin-domain.workspace = true
dunlin-agent.workspace = true
dunlin-storage.workspace = true
dunlin-workspace.workspace = true
dunlin-usage.workspace = true
notify.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
base64 = "0.22"
chrono = "0.4"
ureq = { version = "2.12", features = ["json", "tls"] }
url = "2"
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
resvg = { version = "0.46", default-features = false, features = ["text", "system-fonts"] }
raw-window-handle = "0.6"
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }
similar = "2.7"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "CAShapeLayer", "CATransaction", "objc2-core-foundation", "objc2-core-graphics"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGContext"] }
