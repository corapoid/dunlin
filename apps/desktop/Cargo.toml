[package]
publish = false
name = "dunlin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "dunlin"
path = "src/main.rs"

[dependencies]
hex.workspace = true
gpui-kit.workspace = true
dunlin-ui.workspace = true
dunlin-domain.workspace = true
dunlin-agent.workspace = true
dunlin-coordination.workspace = true
dunlin-artifacts.workspace = true
dunlin-knowledge.workspace = true
dunlin-plugin-host.workspace = true
dunlin-audit.workspace = true
dunlin-plugin.workspace = true
dunlin-ssh.workspace = true
dunlin-storage.workspace = true
dunlin-vault.workspace = true
dunlin-workspace.workspace = true
dunlin-usage.workspace = true
dunlin-terminal.workspace = true
notify.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation = { workspace = true, features = ["NSProcessInfo"] }
base64 = "0.23.1"
chrono = "0.4"
libc = "0.2"
dunlin-http.workspace = true
url = "2"
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.41.1", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
resvg = { version = "0.49", default-features = false, features = ["text", "system-fonts"] }
raw-window-handle = "0.6"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }
similar = "3.2.1"
sha2 = "0.11.1"
tempfile = "3"
async-channel = "2.5"
markdown = "1.0.0"
unicode-segmentation = "1.13.3"
futures-util = "0.3"
regex = "1"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
libc = "0.2"
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "CAShapeLayer", "CATransaction", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotificationSettings", "block2"] }
block2 = "0.6"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGContext"] }
