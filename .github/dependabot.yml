version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 8
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "cargo"
      include: "scope"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    # Minor and major Rust updates stay as individual PRs: many of our
    # dependencies are still 0.x, where a minor bump is a breaking change.
    groups:
      gpui:
        patterns:
          - "gpui*"
        update-types:
          - "patch"
      agent-protocol:
        patterns:
          - "agent-client-protocol*"
        update-types:
          - "patch"
      runtime:
        patterns:
          - "tokio*"
          - "axum"
          - "hyper*"
          - "tower*"
          - "rustls*"
          - "futures-*"
        update-types:
          - "patch"
      storage-and-serialization:
        patterns:
          - "rusqlite"
          - "serde*"
          - "thiserror"
          - "uuid"
        update-types:
          - "patch"
      remaining-patches:
        patterns:
          - "*"
        exclude-patterns:
          - "gpui*"
          - "agent-client-protocol*"
          - "tokio*"
          - "axum"
          - "hyper*"
          - "tower*"
          - "rustls*"
          - "futures-*"
          - "rusqlite"
          - "serde*"
          - "thiserror"
          - "uuid"
        update-types:
          - "patch"

  - package-ecosystem: npm
    directory: "/web"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "web"
    commit-message:
      prefix: "web"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
        update-types:
          - "minor"
          - "patch"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "minor"
          - "patch"
      tooling:
        patterns:
          - "typescript"
          - "prettier"
          - "prettier-plugin-astro"
          - "postcss"
          - "tailwindcss"
          - "@tailwindcss/*"
          - "vite"
          - "sharp"
          - "oxc-transform-react"
        update-types:
          - "patch"
      remaining-patches:
        patterns:
          - "*"
        exclude-patterns:
          - "astro"
          - "@astrojs/*"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "typescript"
          - "prettier"
          - "prettier-plugin-astro"
          - "postcss"
          - "tailwindcss"
          - "@tailwindcss/*"
          - "vite"
          - "sharp"
          - "oxc-transform-react"
        update-types:
          - "patch"

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "github_actions"
    commit-message:
      prefix: "actions"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
