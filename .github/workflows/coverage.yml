name: Coverage

on:
  pull_request:
  workflow_dispatch:
    inputs:
      branches:
        description: Measure unstable branch coverage with nightly Rust
        type: boolean
        default: false

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workspace:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ github.event_name == 'workflow_dispatch' && inputs.branches && 'nightly' || 'stable' }}
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: macos-coverage-v1
          save-if: "false"
      - name: Install pinned coverage tool
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Measure unit and integration coverage, including desktop
        env:
          MEASURE_BRANCHES: ${{ github.event_name == 'workflow_dispatch' && inputs.branches }}
        run: |
          mkdir -p target/coverage
          args=()
          if [[ "$MEASURE_BRANCHES" == "true" ]]; then args+=(--branch); fi
          cargo llvm-cov --workspace --locked "${args[@]}" --json --output-path target/coverage/workspace.json --ignore-filename-regex '(^|/)(vendor|target)/|(^|/)([^/]*_smoke|smoke)\.rs$'
          cargo llvm-cov report --html --output-dir target/coverage --ignore-filename-regex '(^|/)(vendor|target)/|(^|/)([^/]*_smoke|smoke)\.rs$'
          python3 scripts/coverage_summary.py target/coverage/workspace.json --require-desktop --minimum-lines 39 --minimum-desktop-lines 23 > target/coverage/summary.md
          cat target/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload measured coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: workspace-coverage
          retention-days: 7
          path: target/coverage
          if-no-files-found: error
