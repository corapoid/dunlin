name: Package

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Published version without the leading v (for example 1.2.3-beta.1)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  oci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$REQUESTED_VERSION"
          python3 scripts/release_gate.py version --value "$VERSION" >/dev/null
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir dist

      - name: Verify release artifacts
        run: |
          python3 scripts/release_gate.py verify --version "$VERSION" --directory dist \
            --app-name Dunlin --bundle-id dev.dunlin.ide

      - name: Install pinned ORAS
        env:
          ORAS_VERSION: 1.3.6
          ORAS_SHA256: 66fb0ad7206f3f6fa77ed5b552049d364ccf4b50b1684554f731f76302b52ca0
        run: |
          ARCHIVE="$RUNNER_TEMP/oras.tar.gz"
          curl -fsSLo "$ARCHIVE" \
            "https://github.com/oras-project/oras/releases/download/v$ORAS_VERSION/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          echo "$ORAS_SHA256  $ARCHIVE" | sha256sum -c -
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP" oras
          sudo install -m 0755 "$RUNNER_TEMP/oras" /usr/local/bin/oras
          oras version

      - name: Publish OCI package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          DUNLIN_OCI_REPOSITORY="ghcr.io/$GITHUB_REPOSITORY" ./scripts/publish-oci.sh "$VERSION"

      - name: Verify the published package
        run: |
          OUT="$RUNNER_TEMP/pulled"
          oras pull "ghcr.io/$GITHUB_REPOSITORY:$VERSION" -o "$OUT"
          (cd "$OUT" && sha256sum -c SHA256SUMS)
