name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint workflows
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install actionlint
          actionlint

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Format
        run: cargo fmt --all --check

      - name: Reject panic placeholders
        run: |
          if grep -RInE --include='*.rs' '\b(todo!|unimplemented!)' apps crates; then
            echo "::error::Use an explicit error path instead of todo!()/unimplemented!()."
            exit 1
          fi

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Release tooling regression tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Verify reviewed dependency migrations
        run: python3 scripts/verify_vendor.py

      - name: Release metadata
        run: python3 scripts/release_gate.py metadata --version "$(python3 scripts/release_gate.py version)"

      - name: Relay smoke
        run: ./scripts/relay-smoke.sh

      - name: Paired Git HTTP smoke
        run: python3 scripts/git-operations-smoke.py --tmp-root "$RUNNER_TEMP"

      - name: Build app and relay
        env:
          DUNLIN_VERSION: 0.0.0-ci
          DUNLIN_BUILD: ${{ github.run_number }}
        run: |
          ./scripts/bundle-macos.sh --build
          ./scripts/bundle-relay.sh

      - name: Upload app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dunlin-app
          path: dist/*.app
          if-no-files-found: error

      - name: Attest verified mainline CI binaries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.app/Contents/MacOS/*
            dist/dunlin-relay

      - name: Upload relay
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dunlin-relay
          path: dist/dunlin-relay
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Format
        working-directory: web
        run: npm run format:check

      - name: Typecheck and Astro check
        working-directory: web
        run: npm run check

      - name: Build
        working-directory: web
        run: npm run build
