name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Tests
        run: cargo test --workspace

      - name: Relay smoke
        run: ./scripts/relay-smoke.sh

      - name: Build app and relay
        env:
          DUNLIN_VERSION: 0.0.0-ci
          DUNLIN_BUILD: ${{ github.run_number }}
        run: |
          ./scripts/bundle-macos.sh --build
          ./scripts/bundle-relay.sh

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: dunlin-app
          path: dist/*.app
          if-no-files-found: error

      - name: Upload relay
        uses: actions/upload-artifact@v7
        with:
          name: dunlin-relay
          path: dist/dunlin-relay
          if-no-files-found: error
