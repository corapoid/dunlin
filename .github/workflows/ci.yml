name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos-checks:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint workflows
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install actionlint
          actionlint

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: macos-checks-v1
          # Only the main-branch cache warmer writes this cache. PR caches cannot
          # be reused by other PRs or releases and consume storage needlessly.
          save-if: "false"

      - name: Format
        run: cargo fmt --all --check

      - name: Install dependency linter
        run: cargo install cargo-machete --version 0.9.2 --locked

      - name: Unused Rust dependencies
        run: cargo machete --skip-target-dir apps crates

      - name: Enforce UI-free service boundaries
        run: python3 scripts/check_architecture.py

      - name: Reject panic placeholders
        run: |
          if grep -RInE --include='*.rs' '\b(todo!|unimplemented!)' apps crates; then
            echo "::error::Use an explicit error path instead of todo!()/unimplemented!()."
            exit 1
          fi

      - name: Documentation links and navigation
        run: python3 scripts/check_docs.py

      - name: Release tooling regression tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Verify reviewed dependency migrations
        run: python3 scripts/verify_vendor.py

      - name: Release metadata
        run: python3 scripts/release_gate.py metadata --version "$(python3 scripts/release_gate.py version)"

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Relay smoke
        run: ./scripts/relay-smoke.sh

      - name: Paired Git HTTP smoke
        run: python3 scripts/git-operations-smoke.py --tmp-root "$RUNNER_TEMP"

      - name: Build native UI fixtures
        run: cargo build -p dunlin -p dunlin-agent --bin dunlin --bin mock_acp_agent --locked

      # No silent headless skip: a missing WindowServer or a failed scenario
      # fails macos-checks, and therefore the existing required test gate.
      - name: Native UI behavior and layout
        run: python3 scripts/release_qa.py --native-only --tmp-root "$RUNNER_TEMP"

      - name: Upload native QA evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-ui-qa
          retention-days: 7
          path: |
            ${{ runner.temp }}/dunlin-release-qa-*/report.json
            ${{ runner.temp }}/dunlin-release-qa-*/*.log
            ${{ runner.temp }}/dunlin-release-qa-*/dunlin-gui-smoke-*/failure.json
            ${{ runner.temp }}/dunlin-release-qa-*/dunlin-gui-smoke-*/dunlin.log
            ${{ runner.temp }}/dunlin-release-qa-*/dunlin-gui-smoke-*/project/requests.jsonl
          if-no-files-found: warn

  macos-build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: macos-release-v1
          save-if: "false"

      - name: Compile app and relay without distributing the app
        run: |
          cargo build --release -p dunlin -p dunlin-cli -p dunlin-knowledge-mcp -p dunlin-relay --locked
          ./scripts/bundle-relay.sh --no-build

      - name: Upload relay
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dunlin-relay
          retention-days: 3
          path: dist/dunlin-relay
          if-no-files-found: error

      - name: Upload standalone CLI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dunlin-cli-macos
          retention-days: 3
          path: target/release/dunlin-cli
          if-no-files-found: error

  headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: headless-v1
          save-if: "false"
      - name: Test shared services, CLI and server without GPUI
        run: cargo test --workspace --exclude dunlin --exclude dunlin-ui --locked
      - name: Build deterministic CLI fixtures
        run: cargo build -p dunlin-cli -p dunlin-agent --bin dunlin-cli --bin mock_acp_agent --locked
      - name: CLI ACP behavior
        run: python3 scripts/test_headless.py
      - name: Compile standalone CLI
        run: cargo build --release -p dunlin-cli --locked
      - name: Upload standalone CLI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dunlin-cli-linux-x86_64
          retention-days: 3
          path: target/release/dunlin-cli
          if-no-files-found: error

  # Preserve the required status used by branch protection and release_source.py.
  # always() is essential: a failed/cancelled prerequisite must fail this gate,
  # not leave a skipped check that GitHub could consider mergeable.
  test:
    needs: [macos-checks, macos-build, headless, app-web, runtime-sandbox]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require tests and compilation to succeed
        env:
          CHECKS_RESULT: ${{ needs.macos-checks.result }}
          BUILD_RESULT: ${{ needs.macos-build.result }}
          HEADLESS_RESULT: ${{ needs.headless.result }}
          APP_WEB_RESULT: ${{ needs.app-web.result }}
          RUNTIME_RESULT: ${{ needs.runtime-sandbox.result }}
        run: |
          if [[ "$CHECKS_RESULT" != "success" || "$BUILD_RESULT" != "success" || "$HEADLESS_RESULT" != "success" || "$APP_WEB_RESULT" != "success" || "$RUNTIME_RESULT" != "success" ]]; then
            echo "::error::macOS checks: $CHECKS_RESULT; macOS build: $BUILD_RESULT; headless: $HEADLESS_RESULT; web app: $APP_WEB_RESULT; runtime sandbox: $RUNTIME_RESULT"
            exit 1
          fi

  relay-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install static Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add "${{ matrix.target }}"
      - name: Test and build Linux relay
        env:
          TARGET: ${{ matrix.target }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          cargo test -p dunlin-relay -p dunlin-workspace -p dunlin-vault --locked
          CC=musl-gcc cargo build --release -p dunlin-relay --target "$TARGET" --locked
          "target/$TARGET/release/dunlin-relay" --help

  app-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked web app dependencies without lifecycle scripts
        working-directory: apps/web
        run: npm ci --ignore-scripts
      - name: Typecheck web app
        working-directory: apps/web
        run: npm run check
      - name: Test web transport and live state
        working-directory: apps/web
        run: npm test
      - name: Build web app
        working-directory: apps/web
        run: npm run build
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: headless-v1
          save-if: "false"
      - name: Install locked browser driver without lifecycle scripts
        working-directory: apps/web/e2e
        run: npm ci --ignore-scripts
      - name: Provision Chromium for browser acceptance
        run: node apps/web/e2e/node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Real browser to relay acceptance
        env:
          DUNLIN_WEB_E2E_ROOT: ${{ github.workspace }}/apps/web/dist
        run: cargo test -p dunlin-relay production_browser_acceptance --locked -- --ignored --nocapture --skip production_browser_acceptance_runtime_

  # Separate policy for real nested bubblewrap; ordinary browser checks retain
  # Docker's default LSM/seccomp settings. See implement/runtime-checks.md.
  runtime-sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require Linux AppArmor and install its parser
        run: |
          test "$(uname -s)" = Linux
          test "$(cat /sys/module/apparmor/parameters/enabled)" = Y
          docker info --format '{{json .SecurityOptions}}' | grep -q apparmor
          sudo apt-get update
          sudo apt-get install -y apparmor
      - name: Provision cached runtime toolchain images
        run: |
          docker build --tag dunlin-web-checks:rust-1.99 - < scripts/web-checks.Dockerfile
          docker build --tag dunlin-web-checks:browser - < scripts/web-browser-checks.Dockerfile
          docker build --tag dunlin-web-checks:browser-bwrap - < scripts/runtime-checks.Dockerfile
      - name: Fetch locked Rust dependencies before offline execution
        run: |
          mkdir -p target/web-checks/cargo
          docker run --rm --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/repo,readonly" --mount "type=bind,src=$GITHUB_WORKSPACE/target/web-checks/cargo,dst=/cache" --workdir /repo --env CARGO_HOME=/cache dunlin-web-checks:rust-1.99 cargo fetch --locked
      - name: Provision and load only the named runtime policy
        run: |
          python3 scripts/prepare_runtime_sandbox.py --fetch --output target/web-checks/runtime-policies
          sudo apparmor_parser -r target/web-checks/runtime-policies/runtime.apparmor
          sudo grep -q '^dunlin-runtime-checks (enforce)$' /sys/kernel/security/apparmor/profiles
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/web/e2e/package-lock.json
      - name: Install locked runtime UI dependencies without lifecycle scripts
        working-directory: apps/web
        run: npm ci --ignore-scripts
      - name: Install locked runtime browser driver without lifecycle scripts
        working-directory: apps/web/e2e
        run: npm ci --ignore-scripts
      - name: Actual relay restart and Remote UI with real bubblewrap, offline
        run: python3 scripts/test_web_sandbox.py --suite runtime --runtime-browser --node-modules apps/web/node_modules --browser-node-modules apps/web/e2e/node_modules --registry target/web-checks/cargo/registry --wall-seconds 900

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Format
        working-directory: web
        run: npm run format:check

      - name: Typecheck and Astro check
        working-directory: web
        run: npm run check

      - name: Build
        working-directory: web
        run: npm run build
