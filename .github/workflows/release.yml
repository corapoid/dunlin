name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (for example 0.1.0-beta.6)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  source-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      pull-requests: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify signed mainline source and trusted green PR checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_source.py --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"

  release:
    needs: [security, source-authorization]
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    env:
      APP_NAME: ${{ vars.APP_NAME || 'Dunlin' }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'dev.dunlin.ide' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Resolve version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$REQUESTED_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          python3 scripts/release_gate.py metadata --version "$VERSION"
          python3 scripts/release_gate.py acceptance --version "$VERSION"
          test "$(git rev-parse --verify "refs/tags/v$VERSION^{commit}")" = "$(git rev-parse HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test source before packaging
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/verify_vendor.py
          ./scripts/relay-smoke.sh
          python3 scripts/git-operations-smoke.py --tmp-root "$RUNNER_TEMP"

      - name: Build
        env:
          DUNLIN_APP_NAME: ${{ env.APP_NAME }}
          DUNLIN_BUNDLE_ID: ${{ env.BUNDLE_ID }}
          DUNLIN_VERSION: ${{ steps.version.outputs.version }}
          DUNLIN_BUILD: ${{ github.run_number }}
        run: |
          ./scripts/bundle-macos.sh --build
          ./scripts/bundle-relay.sh

      - name: Validate signing configuration
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: python3 scripts/release_gate.py signing-config >> "$GITHUB_OUTPUT"

      - name: Import signing identity
        if: steps.signing.outputs.certificate == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          read -r -a EXISTING_KEYCHAINS <<< "$(security list-keychains -d user | tr -d '"')"
          security list-keychains -d user -s "$KEYCHAIN" "${EXISTING_KEYCHAINS[@]}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ {print $2; exit}')"
          test -n "$IDENTITY"
          echo "DUNLIN_CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/certificate.p12"

      - name: Sign app and relay
        run: |
          if [[ "${DUNLIN_CODESIGN_IDENTITY:--}" == "-" ]]; then
            codesign --force --sign - dist/dunlin-relay
          else
            codesign --force --options runtime --timestamp \
              --sign "$DUNLIN_CODESIGN_IDENTITY" "dist/$APP_NAME.app"
            codesign --force --options runtime --timestamp \
              --sign "$DUNLIN_CODESIGN_IDENTITY" dist/dunlin-relay
          fi
          codesign --verify --deep --strict "dist/$APP_NAME.app"
          codesign --verify --strict dist/dunlin-relay

      - name: Notarize payloads before packaging
        if: steps.signing.outputs.notarize == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent "dist/$APP_NAME.app" "$RUNNER_TEMP/notary-app.zip"
          ditto -c -k --keepParent dist/dunlin-relay "$RUNNER_TEMP/notary-relay.zip"
          for ZIP in "$RUNNER_TEMP/notary-app.zip" "$RUNNER_TEMP/notary-relay.zip"; do
            xcrun notarytool submit "$ZIP" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --wait --output-format json > "$RUNNER_TEMP/notary-result.json"
            python3 scripts/release_gate.py notary --report "$RUNNER_TEMP/notary-result.json"
          done
          xcrun stapler staple "dist/$APP_NAME.app"
          xcrun stapler validate "dist/$APP_NAME.app"

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APP="dist/$APP_NAME.app"
          codesign --verify --deep --strict "$APP"
          codesign --verify --strict dist/dunlin-relay
          ZIP="dist/$APP_NAME-$VERSION-macos-arm64.zip"
          DMG="dist/$APP_NAME-$VERSION-macos-arm64.dmg"
          RELAY="dist/dunlin-relay-$VERSION-macos-arm64.tar.gz"
          ditto -c -k --keepParent "$APP" "$ZIP"
          tar -czf "$RELAY" -C dist dunlin-relay
          mkdir -p dist/dmg
          cp -R "$APP" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "$APP_NAME" -srcfolder dist/dmg -ov -format UDZO "$DMG"
          DUNLIN_VERSION="$VERSION" ./scripts/bundle-pkg.sh

      - name: Notarize final DMG
        if: steps.signing.outputs.notarize == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          DMG="dist/$APP_NAME-$VERSION-macos-arm64.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait --output-format json > "$RUNNER_TEMP/notary-dmg-result.json"
          python3 scripts/release_gate.py notary --report "$RUNNER_TEMP/notary-dmg-result.json"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Final checksums and truthful changelog notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          HAS_CERTIFICATE: ${{ steps.signing.outputs.certificate }}
          NOTARIZED: ${{ steps.signing.outputs.notarize }}
        run: |
          (cd dist && shasum -a 256 "$APP_NAME-$VERSION-macos-arm64.zip" \
            "$APP_NAME-$VERSION-macos-arm64.dmg" "$APP_NAME-$VERSION-macos-arm64.pkg" \
            "dunlin-relay-$VERSION-macos-arm64.tar.gz") > dist/SHA256SUMS
          SIGNING=ad-hoc
          if [[ "$HAS_CERTIFICATE" == true ]]; then SIGNING=developer-id; fi
          if [[ "$NOTARIZED" == true ]]; then SIGNING=notarized; fi
          python3 scripts/release_gate.py notes --version "$VERSION" --signing "$SIGNING" > dist/release-notes.md
          python3 scripts/release_gate.py verify --version "$VERSION" --directory dist \
            --app-name "$APP_NAME" --bundle-id "$BUNDLE_ID"

      - name: Attest artifact provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/${{ env.APP_NAME }}-${{ steps.version.outputs.version }}-macos-arm64.zip
            dist/${{ env.APP_NAME }}-${{ steps.version.outputs.version }}-macos-arm64.dmg
            dist/${{ env.APP_NAME }}-${{ steps.version.outputs.version }}-macos-arm64.pkg
            dist/dunlin-relay-${{ steps.version.outputs.version }}-macos-arm64.tar.gz
            dist/SHA256SUMS

      - name: Store verified release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-files
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.pkg
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/release-notes.md

      - name: Remove temporary signing keychain
        if: always() && steps.signing.outputs.certificate == 'true'
        run: |
          if [[ -f "$RUNNER_TEMP/build.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/build.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/certificate.p12"

  publish:
    needs: release
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      TAG: ${{ needs.release.outputs.tag }}
      APP_NAME: ${{ vars.APP_NAME || 'Dunlin' }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'dev.dunlin.ide' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-files
          path: dist
      - name: Reverify transferred artifacts
        run: |
          python3 scripts/release_gate.py metadata --version "$VERSION"
          python3 scripts/release_gate.py verify --version "$VERSION" --directory dist \
            --app-name "$APP_NAME" --bundle-id "$BUNDLE_ID"
      - name: Publish only verified existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_FLAGS=()
          if [[ "$VERSION" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          gh release create "$TAG" \
            "dist/$APP_NAME-$VERSION-macos-arm64.zip" \
            "dist/$APP_NAME-$VERSION-macos-arm64.dmg" \
            "dist/$APP_NAME-$VERSION-macos-arm64.pkg" \
            "dist/dunlin-relay-$VERSION-macos-arm64.tar.gz" \
            dist/SHA256SUMS \
            --title "$APP_NAME $VERSION" \
            --notes-file dist/release-notes.md \
            --verify-tag \
            --target "$GITHUB_SHA" \
            "${RELEASE_FLAGS[@]}"
