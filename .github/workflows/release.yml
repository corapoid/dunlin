name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (for example 0.2.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    permissions:
      contents: read
      checks: read
      pull-requests: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify signed mainline source and trusted green PR checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_source.py --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"

      - name: Resolve version before starting platform builds
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$REQUESTED_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          python3 scripts/release_gate.py metadata --version "$VERSION"
          python3 scripts/release_gate.py acceptance --version "$VERSION"
          test "$(git rev-parse --verify "refs/tags/v$VERSION^{commit}")" = "$(git rev-parse HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  release:
    needs: source-authorization
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ needs.source-authorization.outputs.version }}
      tag: ${{ needs.source-authorization.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: macos-release-v1
          save-if: "false"

      - name: Build relay only (desktop distribution paused)
        run: ./scripts/bundle-relay.sh

      - name: Validate signing configuration
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: python3 scripts/release_gate.py signing-config >> "$GITHUB_OUTPUT"

      - name: Import signing identity
        if: steps.signing.outputs.certificate == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          read -r -a EXISTING_KEYCHAINS <<< "$(security list-keychains -d user | tr -d '"')"
          security list-keychains -d user -s "$KEYCHAIN" "${EXISTING_KEYCHAINS[@]}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ {print $2; exit}')"
          test -n "$IDENTITY"
          echo "DUNLIN_CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/certificate.p12"

      - name: Sign relay
        run: |
          if [[ "${DUNLIN_CODESIGN_IDENTITY:--}" == "-" ]]; then
            codesign --force --sign - dist/dunlin-relay
          else
            codesign --force --options runtime --timestamp \
              --sign "$DUNLIN_CODESIGN_IDENTITY" dist/dunlin-relay
          fi
          codesign --verify --strict dist/dunlin-relay

      - name: Notarize relay before packaging
        if: steps.signing.outputs.notarize == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent dist/dunlin-relay "$RUNNER_TEMP/notary-relay.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notary-relay.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait --output-format json > "$RUNNER_TEMP/notary-result.json"
          python3 scripts/release_gate.py notary --report "$RUNNER_TEMP/notary-result.json"

      - name: Package and verify macOS relay
        env:
          VERSION: ${{ needs.source-authorization.outputs.version }}
        run: |
          codesign --verify --strict dist/dunlin-relay
          RELAY="dist/dunlin-relay-$VERSION-macos-arm64.tar.gz"
          tar -czf "$RELAY" -C dist dunlin-relay
          python3 scripts/verify-relay-release.py "$RELAY" --platform macos --arch arm64

      - name: Relay checksums and truthful changelog notes
        env:
          VERSION: ${{ needs.source-authorization.outputs.version }}
          HAS_CERTIFICATE: ${{ steps.signing.outputs.certificate }}
          NOTARIZED: ${{ steps.signing.outputs.notarize }}
        run: |
          (cd dist && shasum -a 256 "dunlin-relay-$VERSION-macos-arm64.tar.gz") > dist/MACOS-RELAY-SHA256SUMS
          SIGNING=ad-hoc
          if [[ "$HAS_CERTIFICATE" == true ]]; then SIGNING=developer-id; fi
          if [[ "$NOTARIZED" == true ]]; then SIGNING=notarized; fi
          python3 scripts/release_gate.py notes --version "$VERSION" --signing "$SIGNING" > dist/release-notes.md

      - name: Attest artifact provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/dunlin-relay-${{ needs.source-authorization.outputs.version }}-macos-arm64.tar.gz
            dist/MACOS-RELAY-SHA256SUMS

      - name: Store verified release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-files
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/MACOS-RELAY-SHA256SUMS
            dist/release-notes.md

      - name: Remove temporary signing keychain
        if: always() && steps.signing.outputs.certificate == 'true'
        run: |
          if [[ -f "$RUNNER_TEMP/build.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/build.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/certificate.p12"

  relay-linux:
    needs: source-authorization
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install static Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add "${{ matrix.target }}"
      - name: Build and verify Linux relay package
        env:
          VERSION: ${{ needs.source-authorization.outputs.version }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          CC=musl-gcc cargo build --release -p dunlin-relay --target "$TARGET" --locked
          "target/$TARGET/release/dunlin-relay" --help
          mkdir -p dist
          tar -czf "dist/dunlin-relay-$VERSION-linux-$ARCH.tar.gz" -C "target/$TARGET/release" dunlin-relay
          python3 scripts/verify-relay-release.py "dist/dunlin-relay-$VERSION-linux-$ARCH.tar.gz" --arch "$ARCH"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-relay-${{ matrix.arch }}
          if-no-files-found: error
          path: dist/*.tar.gz

  publish:
    needs: [release, relay-linux]
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      TAG: ${{ needs.release.outputs.tag }}
      APP_NAME: ${{ vars.APP_NAME || 'Dunlin' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-files
          path: dist
      - name: Reverify transferred artifacts
        run: |
          python3 scripts/release_gate.py metadata --version "$VERSION"
          (cd dist && shasum -a 256 -c MACOS-RELAY-SHA256SUMS)
          python3 scripts/verify-relay-release.py "dist/dunlin-relay-$VERSION-macos-arm64.tar.gz" --platform macos --arch arm64
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: linux-relay-*
          merge-multiple: true
          path: dist
      - name: Verify server distribution and bootstrap scripts
        run: |
          python3 scripts/verify-relay-release.py "dist/dunlin-relay-$VERSION-linux-x86_64.tar.gz" --arch x86_64
          python3 scripts/verify-relay-release.py "dist/dunlin-relay-$VERSION-linux-arm64.tar.gz" --arch arm64
          bash -n scripts/install-relay.sh scripts/install-harness.sh
          cp scripts/install-relay.sh scripts/install-harness.sh dist/
          (cd dist && shasum -a 256 "dunlin-relay-$VERSION-macos-arm64.tar.gz" \
            "dunlin-relay-$VERSION-linux-x86_64.tar.gz" "dunlin-relay-$VERSION-linux-arm64.tar.gz" \
            install-relay.sh install-harness.sh) > dist/RELAY-SHA256SUMS
          printf '\nServer setup: macOS arm64 and Linux x86_64/arm64 relay archives, interactive bootstrap and RELAY-SHA256SUMS are included. See docs/relay-setup.md for trust boundaries and acceptance requirements.\n' >> dist/release-notes.md
      - name: Publish only verified existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "dist/dunlin-relay-$VERSION-macos-arm64.tar.gz" \
            "dist/dunlin-relay-$VERSION-linux-x86_64.tar.gz" \
            "dist/dunlin-relay-$VERSION-linux-arm64.tar.gz" \
            dist/install-relay.sh dist/install-harness.sh dist/RELAY-SHA256SUMS \
            --title "$APP_NAME $VERSION" \
            --notes-file dist/release-notes.md \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --prerelease=false \
            --latest
