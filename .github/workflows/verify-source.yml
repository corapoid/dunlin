name: Verify release source

# Read-only rehearsal of release authorization; never builds/publishes a release
# or changes tags. Useful for verifying actual GITHUB_TOKEN API visibility.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact signed mainline commit SHA to authorize
        required: true
        type: string

permissions:
  contents: read
  checks: read
  pull-requests: read
  security-events: read

jobs:
  source-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify actual source with a read-only workflow token
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.commit }}
        run: python3 scripts/release_source.py --repo "$GITHUB_REPOSITORY" --commit "$SOURCE_SHA"
