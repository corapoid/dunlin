[package]
name = "ahp"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/microsoft/agent-host-protocol"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ahp-types = "=1.0.0"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
tracing = "0.1"
jiff = { version = "0.2", default-features = false, features = ["std"] }
