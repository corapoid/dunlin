[package]
publish = false
name = "dunlin-relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "dunlin-relay"
path = "src/main.rs"

[dependencies]
hex.workspace = true
dunlin-workspace.workspace = true
dunlin-usage.workspace = true
dunlin-domain.workspace = true
dunlin-terminal.workspace = true
dunlin-storage.workspace = true
dunlin-vault.workspace = true
dunlin-coordination.workspace = true
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "time", "sync", "signal", "fs"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
rand = "0.10.3"
sha2 = "0.11.1"
base64 = "0.23.1"
futures-util = "0.3"
toml = "1.2.1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.30.0"
