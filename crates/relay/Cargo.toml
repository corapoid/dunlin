[package]
name = "kestrel-relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "kestrel-relay"
path = "src/main.rs"

[dependencies]
kestrel-workspace.workspace = true
kestrel-usage.workspace = true
kestrel-domain.workspace = true
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "time", "sync", "signal"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"
futures-util = "0.3"
toml = "0.8"
