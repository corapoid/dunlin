[package]
name = "dunlin-relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "dunlin-relay"
path = "src/main.rs"

[dependencies]
dunlin-workspace.workspace = true
dunlin-usage.workspace = true
dunlin-domain.workspace = true
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "time", "sync", "signal"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
rand = "0.10"
sha2 = "0.11"
base64 = "0.23"
futures-util = "0.3"
toml = "1.1"
