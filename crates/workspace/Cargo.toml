[package]
publish = false
name = "dunlin-workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
libc = "0.2"
toml = "1.2.1"
sha2 = "0.11.1"
base64 = "0.23.1"
syn = { version = "3.0.10", features = ["full", "visit"] }
# AST evidence needs real source lines through proc_macro2::Span::start().
proc-macro2 = { version = "1", features = ["span-locations"] }

[dev-dependencies]
tempfile = "3"
