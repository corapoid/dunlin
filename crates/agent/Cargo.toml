[package]
name = "dunlin-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
agent-client-protocol = { version = "3.5", features = ["process", "stdio"] }
async-channel = "2"
async-io = "2"
futures-util = "0.3"
http = "1"
dunlin-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
similar = "2.7"
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "macros"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

[[bin]]
name = "acp_smoke"
path = "src/bin/acp_smoke.rs"

[[bin]]
name = "mock_acp_agent"
path = "src/bin/mock_acp_agent.rs"

[[bin]]
name = "permission_smoke"
path = "src/bin/permission_smoke.rs"

[[bin]]
name = "remote_smoke"
path = "src/bin/remote_smoke.rs"
