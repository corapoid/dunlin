[package]
publish = false
name = "dunlin-vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
manual-acceptance = []

[[bin]]
name = "vault_acceptance"
path = "src/bin/vault_acceptance.rs"
required-features = ["manual-acceptance"]
test = false

[dependencies]
hex.workspace = true
dunlin-domain.workspace = true
dunlin-storage.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url = "2"
dunlin-http.workspace = true
dunlin-mcp-client.workspace = true
zeroize = "1"
sha2 = "0.11.1"
hmac = "0.13.0"
chrono = "0.4"
base64 = "0.23.1"
percent-encoding = "2"
rand = "0.10.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[dev-dependencies]
tempfile = "3"
